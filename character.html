<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHARACTER — SKY GARDEN QUARTET</title><link rel="stylesheet" href="site.css"></head><body><div class="shell"><div class="gridfx"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark"><b>SG</b></span><span class="brandtxt"><b>SKY GARDEN QUARTET</b><small>空中庭園四重奏</small></span></a><nav class="nav"><a href="index.html">TOP</a><a href="story.html">STORY</a><a href="character.html">CHARACTER</a><a href="gallery.html">GALLERY</a><a href="special.html">SPECIAL</a><a href="pv.html">PV</a></nav></header><section class="pagehead"><div class="ghost">CHARACTER</div><div><div class="eyebrow">FOUR COLORS / FOUR PERSONALITIES</div><h1>CHARA<span>CTER</span></h1><div class="jp">登場人物</div><p class="lead">四人のキャラクターを大きなビジュアルと専用カラーで紹介。各カードをタップすると、その人物らしい一言をずんだもんボイスで再生します。</p></div></section><main class="content"><div class="cardgrid" id="charGrid"></div></main><footer class="footer"><b>SKY GARDEN QUARTET</b><span>CHARACTER ARCHIVE / TAP A CARD FOR VOICE</span></footer></div><script src="site.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const g=document.getElementById('charGrid');SQ_VISITORS.forEach((v,i)=>{const a=document.createElement('article');a.className='char-card';a.style.setProperty('--accent',v.accent);a.innerHTML=`<img src="${v.img}" alt="${v.name}"><div class="meta"><div class="num">VISITOR 0${i+1}</div><div class="en">${v.eng}</div><div class="ja">${v.name}</div><div style="font-size:9px;letter-spacing:.12em;margin-top:8px;color:#cbd7ef">${v.role}</div></div>`;a.addEventListener('click',()=>{burstPetals(18);voiceLine(v.quotes[Math.floor(Math.random()*v.quotes.length)])});g.appendChild(a)})})</script></body></html>
