name: Site QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import re, subprocess, tempfile

          root = Path('.')
          required = [
              'index.html','story.html','character.html','gallery.html','special.html','pv.html',
              'news.html','music.html','staffcast.html','onair.html',
              'char-01-azure.html','char-02-violet.html','char-03-silver.html','char-04-scarlet.html',
              'site.css','site.js','character-detail.css','official-sections.css',
              'assets/sky-garden/01-attendant.webp','assets/sky-garden/02-hare.webp',
              'assets/sky-garden/03-horn.webp','assets/sky-garden/04-dancer.webp'
          ]
          errors = []
          for rel in required:
              p = root / rel
              if not p.exists(): errors.append(f'MISSING required file: {rel}')
              elif p.is_file() and p.stat().st_size == 0: errors.append(f'EMPTY required file: {rel}')

          class Checker(HTMLParser):
              def __init__(self, page):
                  super().__init__(convert_charrefs=True)
                  self.page = page
                  self.refs = []
                  self.ids = []
                  self.img_alts = []
                  self.has_title = False
                  self.has_viewport = False
                  self.has_charset = False
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == 'title': self.has_title = True
                  if tag == 'meta':
                      if d.get('name','').lower() == 'viewport': self.has_viewport = True
                      if d.get('charset'): self.has_charset = True
                  if d.get('id'): self.ids.append(d['id'])
                  for attr in ('href','src'):
                      if d.get(attr): self.refs.append((tag, attr, d[attr]))
                  if tag == 'img': self.img_alts.append(d.get('alt'))

          def local_target(page, ref):
              ref = ref.strip()
              if not ref or ref.startswith(('#','mailto:','tel:','javascript:','data:')): return None
              u = urlsplit(ref)
              if u.scheme or u.netloc: return None
              path = unquote(u.path)
              if not path: return None
              return (page.parent / path).resolve()

          html_files = sorted(root.glob('*.html'))
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              c = Checker(page)
              try: c.feed(text)
              except Exception as e: errors.append(f'{page}: HTML parse error: {e}')
              if '<title>' not in text.lower(): errors.append(f'{page}: missing <title>')
              if not c.has_viewport: errors.append(f'{page}: missing viewport meta')
              if not c.has_charset: errors.append(f'{page}: missing charset meta')
              seen = set()
              for ident in c.ids:
                  if ident in seen: errors.append(f'{page}: duplicate id #{ident}')
                  seen.add(ident)
              for alt in c.img_alts:
                  if alt is None or not alt.strip(): errors.append(f'{page}: image missing alt text')
              for tag, attr, ref in c.refs:
                  target = local_target(page, ref)
                  if target is not None and not target.exists():
                      errors.append(f'{page}: broken {attr}={ref}')
              for ref in re.findall(r"url\(\s*['\"]?([^)'\"]+)", text):
                  target = local_target(page, ref)
                  if target is not None and not target.exists(): errors.append(f'{page}: broken CSS url({ref})')

              inline = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, flags=re.I|re.S)
              for n, script in enumerate(inline, 1):
                  if not script.strip(): continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                      f.write(script); tmp = f.name
                  p = subprocess.run(['node','--check',tmp], text=True, capture_output=True)
                  Path(tmp).unlink(missing_ok=True)
                  if p.returncode:
                      errors.append(f'{page}: inline script {n} syntax error: {p.stderr.strip()}')

          for css in root.glob('*.css'):
              text = css.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  errors.append(f'{css}: unbalanced braces')
              for ref in re.findall(r"url\(\s*['\"]?([^)'\"]+)", text):
                  target = local_target(css, ref)
                  if target is not None and not target.exists(): errors.append(f'{css}: broken url({ref})')

          p = subprocess.run(['node','--check','site.js'], text=True, capture_output=True)
          if p.returncode: errors.append('site.js syntax error: ' + p.stderr.strip())

          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              raise SystemExit(1)
          print(f'PASS: {len(html_files)} HTML pages validated; required files, local refs, IDs, alt text and JS syntax are OK.')
          PY

      - name: Smoke test through HTTP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/sg-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          for page in index.html story.html character.html gallery.html special.html pv.html news.html music.html staffcast.html onair.html char-01-azure.html char-02-violet.html char-03-silver.html char-04-scarlet.html; do
            curl --fail --silent --show-error "http://127.0.0.1:8000/$page" >/dev/null
          done
          for asset in assets/sky-garden/01-attendant.webp assets/sky-garden/02-hare.webp assets/sky-garden/03-horn.webp assets/sky-garden/04-dancer.webp site.css site.js character-detail.css official-sections.css; do
            curl --fail --silent --show-error "http://127.0.0.1:8000/$asset" >/dev/null
          done
          echo 'PASS: HTTP smoke test succeeded.'
