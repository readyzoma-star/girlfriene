<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GALLERY — SKY GARDEN QUARTET</title><link rel="stylesheet" href="site.css"><style>.gallery-select-head{min-height:32vh;padding-bottom:22px}.gallery-select-head .lead{max-width:760px}.gallery-picker-wrap{max-width:1180px;margin:0 auto}.gallery-picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.gallery-choice{position:relative;aspect-ratio:1/1;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:#0d1330;color:#fff;padding:0;cursor:pointer;box-shadow:0 18px 44px rgba(0,0,0,.18);transition:.28s var(--ease)}.gallery-choice:before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,transparent 44%,rgba(3,7,23,.9) 100%);pointer-events:none}.gallery-choice:after{content:"OPEN 8K";position:absolute;right:10px;top:10px;z-index:3;padding:5px 7px;background:rgba(5,9,28,.72);border:1px solid rgba(255,255,255,.2);font:400 9px 'Bebas Neue';letter-spacing:.16em;opacity:.78}.gallery-choice:hover,.gallery-choice:focus-visible{transform:translateY(-6px);border-color:var(--accent);outline:none}.gallery-choice img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 22%;transition:.32s var(--ease)}.gallery-choice:hover img,.gallery-choice:focus-visible img{transform:scale(1.035);filter:saturate(1.06)}.gallery-choice .choice-meta{position:absolute;z-index:4;left:13px;right:13px;bottom:12px;text-align:left}.gallery-choice .choice-num{display:block;font:400 9px 'Bebas Neue';letter-spacing:.24em;color:var(--accent)}.gallery-choice .choice-en{display:block;margin-top:3px;font:400 clamp(22px,2.5vw,36px)/.9 'Bebas Neue';letter-spacing:.03em}.gallery-choice .choice-ja{display:block;margin-top:5px;font-size:10px;font-weight:900;letter-spacing:.08em}.gallery-hint{margin:16px 0 0;text-align:center;font-size:10px;line-height:1.8;color:#bdcbe8;letter-spacing:.06em}.gallery-hint b{color:#fff}.modal img{max-height:90vh}.gallery-choice:nth-child(1){--accent:#31d8ff}.gallery-choice:nth-child(2){--accent:#8d67ff}.gallery-choice:nth-child(3){--accent:#b889ff}.gallery-choice:nth-child(4){--accent:#62e3b3}@media(max-width:840px){.gallery-select-head{min-height:auto;padding:42px 16px 15px}.gallery-select-head .ghost{font-size:34vw;top:0}.gallery-select-head h1{font-size:18vw}.gallery-select-head .jp{margin-top:8px}.gallery-select-head .lead{font-size:10px;line-height:1.65;margin-top:10px}.gallery-select-content{padding:8px 10px 80px}.gallery-picker{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gallery-choice{aspect-ratio:1/1}.gallery-choice:after{right:6px;top:6px;font-size:8px;padding:4px 5px}.gallery-choice .choice-meta{left:9px;right:9px;bottom:8px}.gallery-choice .choice-en{font-size:21px}.gallery-choice .choice-ja{font-size:9px;margin-top:3px}.gallery-hint{margin-top:10px;font-size:9px}}</style></head><body><div class="shell"><div class="gridfx"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark"><b>SG</b></span><span class="brandtxt"><b>SKY GARDEN QUARTET</b><small>空中庭園四重奏</small></span></a><nav class="nav"><a href="index.html">TOP</a><a href="story.html">STORY</a><a href="character.html">CHARACTER</a><a href="gallery.html">GALLERY</a><a href="special.html">SPECIAL</a><a href="pv.html">PV</a></nav></header><section class="pagehead gallery-select-head"><div class="ghost">GALLERY</div><div><div class="eyebrow">SELECT A CHARACTER</div><h1>GALL<span>ERY</span></h1><div class="jp">4人から選ぶギャラリー</div><p class="lead">縦長ビジュアルを一覧に並べず、4人を軽量サムネイルで一画面にまとめました。見たい人物を選ぶと、その時だけ8Kマスターを開きます。</p></div></section><main class="content gallery-select-content"><div class="gallery-picker-wrap"><div class="gallery-picker" id="galleryPicker"></div><p class="gallery-hint"><b>4人のサムネイルから選択</b> → タップした人物だけ高解像度で表示します。</p></div></main><div class="modal"><button aria-label="Close">×</button><img alt="Expanded character visual" decoding="async"></div><footer class="footer"><b>SKY GARDEN QUARTET</b><span>4-CHARACTER THUMBNAIL SELECTOR / 8K ON-DEMAND / VOICEVOX:ずんだもん</span></footer></div><script src="site.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const g=document.getElementById('galleryPicker');SQ_VISITORS.forEach((v,i)=>{const b=document.createElement('button');b.className='gallery-choice';b.type='button';b.dataset.modalImg=v.master;b.setAttribute('aria-label',`${v.name}の8Kビジュアルを開く`);b.innerHTML=`<img src="${v.thumb}" alt="${v.name}" decoding="async"><span class="choice-meta"><span class="choice-num">VISITOR 0${i+1}</span><span class="choice-en">${v.eng}</span><span class="choice-ja">${v.name}</span></span>`;g.appendChild(b)});initGallery()})</script></body></html>
