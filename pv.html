<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PV — SKY GARDEN QUARTET</title><link rel="stylesheet" href="site.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html"><span class="mark"><b>SG</b></span><span class="brandtxt"><b>SKY GARDEN QUARTET</b><small>空中庭園四重奏</small></span></a><nav class="nav"><a href="index.html">TOP</a><a href="story.html">STORY</a><a href="character.html">CHARACTER</a><a href="gallery.html">GALLERY</a><a href="special.html">SPECIAL</a><a href="pv.html">PV</a></nav></header><main class="pv-stage"><div class="pv-bg" id="pvBg"></div><div class="pv-art"><img id="pvArt" alt="PV character"></div><div class="scan"></div><div class="pv-copy"><div class="count" id="pvCount">VISITOR 01 / PROMOTION MOVIE</div><h1 id="pvName">NATSUNAGI AOI</h1><p id="pvLine">海も空も、今日は最高。ほら、もっとこっちにおいでよ。</p></div><div class="pv-controls"><button id="prev">‹</button><button id="voice" aria-label="Play video voice sample">▶</button><button id="next">›</button></div></main></div><script src="site.js"></script><script>let i=0,timer=null;const art=document.getElementById('pvArt'),bg=document.getElementById('pvBg'),name=document.getElementById('pvName'),line=document.getElementById('pvLine'),count=document.getElementById('pvCount');function show(n,auto=false){i=(n+SQ_VISITORS.length)%SQ_VISITORS.length;const v=SQ_VISITORS[i],q=v.quotes[Math.floor(Math.random()*v.quotes.length)];art.style.opacity='0';art.style.transform='translateX(45px) scale(.97)';setTimeout(()=>{art.src=v.img;art.alt=v.name;bg.style.backgroundImage=`url('${v.img}')`;name.textContent=v.eng;line.textContent=q;count.textContent=`VISITOR 0${i+1} / PROMOTION MOVIE`;document.documentElement.style.setProperty('--accent',v.accent);art.style.opacity='1';art.style.transform='none';burstPetals(14)},180);clearTimeout(timer);timer=setTimeout(()=>show(i+1,true),5200)}document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.getElementById('voice').onclick=()=>playVoiceSample(i);show(0);</script></body></html>
